window.F1_LIFE_SUPABASE = window.F1_LIFE_SUPABASE || { url: '', key: '' };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;500;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F1F0ED; --card: #FBFAF8; --ink: #17171B; --ink2: #56575F; --ink3: #85868E; --line: #D4D3CF; --line2: #E6E5E1;
  --pitch: #C8102E; --pitch-ink: #FFFFFF; --grass1: #2A2C31; --grass2: #202226; --chalk: rgba(255,255,255,.78);
  --gold: #9A6E05; --red: #C23A2F; --blue: #2459A6; --shade: #E7E5E0; --stripe: rgba(23,23,27,.028);
  --board: #0E0F13; --board2: #17181D; --boardT: #ECECEE; --led: #FFD23F; --yellow: #E5B400; --purple: #A855F7; --green: #22C55E;
  --win: #1D7A4C; --loss: #C23A2F; --focus: #C8102E; --asphalt: #2B2D33; --kerb: #E03131;
  --display: 'Do Hyeon', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --body: 'Gothic A1', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif;
  --num: 'Barlow Condensed', 'Arial Narrow', 'Apple SD Gothic Neo', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D0E11; --card: #15161A; --ink: #E7E7EA; --ink2: #A2A3AA; --ink3: #6D6F77; --line: #2A2C32; --line2: #1E1F24;
    --pitch: #F0484F; --pitch-ink: #140507; --grass1: #1B1C20; --grass2: #141518; --chalk: rgba(255,255,255,.62);
    --gold: #E0B447; --red: #EE6B5F; --blue: #86AEEB; --shade: #1C1D22; --stripe: rgba(255,255,255,.018);
    --board: #07080A; --board2: #0F1013; --win: #5BC48C; --loss: #EE6B5F; --focus: #F0484F; --asphalt: #24262B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D0E11; --card: #15161A; --ink: #E7E7EA; --ink2: #A2A3AA; --ink3: #6D6F77; --line: #2A2C32; --line2: #1E1F24;
  --pitch: #F0484F; --pitch-ink: #140507; --grass1: #1B1C20; --grass2: #141518; --chalk: rgba(255,255,255,.62);
  --gold: #E0B447; --red: #EE6B5F; --blue: #86AEEB; --shade: #1C1D22; --stripe: rgba(255,255,255,.018);
  --board: #07080A; --board2: #0F1013; --win: #5BC48C; --loss: #EE6B5F; --focus: #F0484F; --asphalt: #24262B; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6;
  background-image: repeating-linear-gradient(135deg, var(--stripe) 0 22px, transparent 22px 44px); background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
#app { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 40px; }
h1, h2, h3 { margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 17px; margin-bottom: 10px; font-weight: 700; }
h2 small, h3 small { font-weight: 400; color: var(--ink2); font-size: 13px; margin-left: 6px; }
h3 { font-size: 14px; font-weight: 700; }
.mt { margin-top: 16px; margin-bottom: 6px; }
.display { font-family: var(--display); font-weight: 400; letter-spacing: 0; }
.muted { color: var(--ink2); }
.center { text-align: center; }
.hint { color: var(--ink2); font-size: 13px; margin: 8px 0 0; }
.k { color: var(--ink3); font-size: 12px; letter-spacing: .02em; }
.red { color: var(--red); }
.err { color: var(--red); font-weight: 500; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 16px; margin: 12px 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; }
.gap { gap: 8px; }
.btn { border: 1.5px solid var(--ink); background: transparent; padding: 9px 16px; border-radius: 4px; cursor: pointer; font-weight: 700; min-height: 42px; }
.btn:hover { background: var(--shade); }
.btn.primary { background: var(--pitch); border-color: var(--pitch); color: var(--pitch-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { padding: 5px 12px; min-height: 34px; font-size: 13px; }
.btn.wide { width: 100%; margin-top: 10px; }
.btn.on { background: var(--ink); color: var(--paper); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn small { font-weight: 400; opacity: .75; font-size: 11px; margin-left: 4px; }
.link { background: none; border: none; color: var(--ink2); cursor: pointer; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
.bar { display: inline-block; width: 100%; max-width: 140px; height: 6px; background: var(--line2); border-radius: 3px; vertical-align: middle; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pitch); }
.bar.red i { background: var(--red); }
.bar.gold i { background: var(--gold); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; }
.seg button { border: none; background: transparent; padding: 7px 12px; cursor: pointer; font-weight: 500; }
.seg button + button { border-left: 1.5px solid var(--ink); }
.seg button.on { background: var(--ink); color: var(--paper); }
.seg.sm button { padding: 4px 10px; font-size: 13px; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

/* title */
.title-screen { padding-top: 6vh; }
.eyebrow { font-size: 13px; letter-spacing: .12em; color: var(--pitch); font-weight: 700; }
.title-block h1 { font-size: clamp(68px, 17vw, 136px); line-height: .95; margin-top: 6px; }
.title-block .lede { max-width: 34em; font-size: 16px; color: var(--ink2); margin: 16px 0 24px; }
.title-block .lede.sm { font-size: 14px; margin-top: -12px; color: var(--ink2); border-left: 3px solid var(--pitch); padding-left: 10px; }
.continue { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; border-left: 4px solid var(--pitch); border-radius: 0 6px 6px 0; }
.continue .big { font-family: var(--display); font-size: 28px; line-height: 1.2; }
.how { margin-top: 28px; }
.flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: f; }
.flow li { display: grid; grid-template-columns: 104px 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line2); font-size: 14px; }
.flow li b { font-family: var(--display); font-weight: 400; font-size: 17px; color: var(--pitch); }
.flow li span { color: var(--ink2); }

/* create */
.create-head { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
.display.sm { font-size: 36px; }
.form { display: grid; gap: 12px; }
.field { display: grid; grid-template-columns: 124px 1fr; align-items: center; gap: 10px; }
.field > span { color: var(--ink2); font-size: 14px; }
.field input, .field select { font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 4px; padding: 8px 10px; min-height: 42px; width: 100%; max-width: 320px; }
.field input:focus, .field select:focus { border-color: var(--ink); outline: none; }
.field > .seg { justify-self: start; }
@media (max-width: 420px) { .field > .seg button { padding: 7px 9px; } }
.bp-sel { display: flex; flex-wrap: wrap; gap: 6px; }
.bp-sel select { width: auto; min-width: 118px; max-width: 220px; flex: 0 1 auto; }
.unit-in { display: inline-flex; align-items: center; gap: 8px; justify-self: start; }
.unit-in input { width: 96px; }
.unit-in em { font-style: normal; color: var(--ink2); }
.body-hint { margin: -4px 0 2px; }
.body-hint b { color: var(--ink); }
.body-fx { display: inline-block; color: var(--pitch); font-weight: 600; }
.avatar { display: inline-block; border-radius: 4px; object-fit: cover; background: var(--shade); border: 1px solid var(--line); flex: none; }
.avatar.md { width: 56px; height: 56px; }
.avatar.sm { width: 30px; height: 30px; border-radius: 3px; vertical-align: -6px; margin-right: 8px; }
.top .id.has-ph { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: center; }
.top .id.has-ph .avatar { grid-row: span 3; }
/* the picture card: a square on the right of the player's details */
main.create { max-width: 820px; }
.cform { grid-template-columns: minmax(0, 1fr) 200px; grid-template-areas: "head photo" "rest photo"; column-gap: 28px; align-items: start; }
.cf-head, .cf-rest { display: grid; gap: 12px; min-width: 0; }
.cf-head { grid-area: head; } .cf-rest { grid-area: rest; } .cf-photo { grid-area: photo; }
.ph-card { width: 100%; }
.ph-box { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; width: 100%; aspect-ratio: 1 / 1; border: 1.5px dashed var(--ink3); border-radius: 4px; background: var(--shade); overflow: hidden; cursor: pointer; color: var(--ink2); text-align: center; }
.ph-box:hover { border-color: var(--ink); color: var(--ink); }
.ph-box:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.ph-box input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.ph-box svg { width: 46%; fill: var(--ink3); opacity: .5; margin-top: 8%; }
.ph-cta { font-size: 13px; font-weight: 700; line-height: 1.3; margin-bottom: 6%; }
.ph-cta small { display: block; font-weight: 400; color: var(--ink3); font-size: 12px; }
.ph-box.has { border: 1px solid var(--line); background: var(--card); }
.ph-box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ph-over { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 4px; font-size: 12px; font-weight: 700; color: #fff; background: rgba(8, 20, 14, .62); opacity: 0; transition: opacity .15s; }
.ph-box.has:hover .ph-over, .ph-box.has:focus-within .ph-over { opacity: 1; }
.ph-act { display: flex; justify-content: center; gap: 16px; margin-top: 4px; }
.ph-act .link { padding: 4px 0; }
.prof-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 176px; grid-template-areas: "id photo" "dl photo"; column-gap: 24px; align-items: start; }
.prof-id { grid-area: id; margin-bottom: 12px; } .prof-wrap > .prof { grid-area: dl; } .prof-photo { grid-area: photo; }
.prof-id h2 { margin-bottom: 2px; }
.prof-nm { font-size: 30px; line-height: 1.15; }
.prof-sub span { white-space: nowrap; }
@media (max-width: 760px) {
  .cform { grid-template-columns: minmax(0, 1fr) 124px; grid-template-areas: "head photo" "rest rest"; column-gap: 14px; }
  .prof-wrap { grid-template-columns: minmax(0, 1fr) 112px; grid-template-areas: "id photo" "dl dl"; column-gap: 14px; }
  .prof-photo { margin-bottom: 12px; }
  .prof-nm { font-size: 26px; }
  .ph-cta { font-size: 12px; }
}
.prof dd .sm { font-size: 13px; font-weight: 400; }
.life { margin: -4px 0 4px; padding: 8px 12px; background: var(--shade); border-radius: 4px; color: var(--ink); }
.pool-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
.pool b { font-family: var(--num); font-size: 30px; font-weight: 700; margin-left: 4px; color: var(--pitch); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; }
.presets small { color: inherit; opacity: .7; margin-left: 2px; }
.custom { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink2); margin-left: 4px; }
.num { font-family: var(--num); font-weight: 600; font-size: 20px; text-align: center; width: 64px; min-height: 36px; border: 1.5px solid var(--line); border-radius: 4px; background: var(--card); color: var(--ink); -moz-appearance: textfield; }
.num::-webkit-inner-spin-button, .num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

/* header */
.top { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: start; padding: 8px 0 14px; border-bottom: 2px solid var(--ink); }
.top .nm { font-size: 36px; line-height: 1.1; }
.top .sub { font-size: 14px; }
.ovr { grid-row: span 2; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 74px; height: 74px; border-radius: 50%; background: var(--pitch); color: var(--pitch-ink); box-shadow: inset 0 0 0 3px var(--card), 0 0 0 2px var(--pitch); }
.ovr .g { font-family: var(--num); font-weight: 700; font-size: 34px; line-height: 1; }
.ovr .n { font-family: var(--num); font-size: 15px; opacity: .85; }
.when { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 14px; }
.when .date { font-weight: 700; }
.when .phase { color: var(--pitch); font-weight: 700; }
.legend-mini { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--ink2); margin-left: auto; }
.legend-mini span { color: var(--gold); font-weight: 700; }
.legend-mini b { font-family: var(--num); font-size: 17px; color: var(--ink); }
.legend-mini .bar { width: 90px; }
.legend-mini small { font-size: 12px; }
.tabs { display: flex; gap: 2px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding: 6px 0; overflow-x: auto; }
.tabs button { flex: 1; border: none; border-bottom: 3px solid transparent; background: transparent; padding: 8px 10px; cursor: pointer; font-weight: 700; color: var(--ink2); white-space: nowrap; min-height: 42px; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--pitch); }
.foot { display: flex; justify-content: space-between; align-items: center; color: var(--ink3); font-size: 13px; padding: 16px 0; }

/* play */
.week-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; }
.week-grid .v { font-weight: 500; font-size: 14px; }
.tag { display: inline-block; font-size: 12px; color: var(--pitch); border: 1px solid var(--pitch); border-radius: 3px; padding: 0 6px; margin: 4px 4px 0 0; }
.cond.c0, .cond.c1 { color: var(--red); } .cond.c3, .cond.c4 { color: var(--win); }
.effmod { font-size: 12px; font-weight: 700; color: var(--ink2); }
.effmod.up { color: var(--win); } .effmod.down { color: var(--red); }
.train-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
.toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 700; font-size: 14px; }
.toggle input { width: 18px; height: 18px; accent-color: var(--pitch); }
.toggle small { font-weight: 400; color: var(--ink2); }
.toggle.sm { font-size: 13px; font-weight: 500; }
.live-tg { margin-top: 10px; font-weight: 500; }
.train-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; margin-top: 10px; }
.tr { display: grid; gap: 1px; text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 4px; padding: 8px 10px; cursor: pointer; }
.tr:hover { border-color: var(--ink2); }
.tr.on { border-color: var(--pitch); background: var(--pitch); color: var(--pitch-ink); }
.tr .tl { font-weight: 700; font-size: 14px; }
.tr .tv b { font-family: var(--num); font-weight: 700; font-size: 24px; line-height: 1.1; }
.tr .tv em { font-style: normal; font-size: 13px; opacity: .8; }
.tr .tp { font-size: 12px; opacity: .8; }
.tr.rest .tv, .tr.alt .tv { font-size: 13px; }
.tr.cap:not(.on) { border-style: dashed; }
.tr.cap .tp { opacity: 1; font-weight: 700; color: var(--gold); }
.tr.cap.on .tp { color: inherit; }
.adv { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.adv .btn { flex: 1; min-width: 96px; }
.prog { min-height: 1.2em; margin: 8px 0 0; font-size: 13px; color: var(--pitch); font-weight: 500; }
.acts .act-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.result .res-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.train-msg { font-weight: 500; margin: 6px 0 10px; }
.stamp { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--pitch); color: var(--pitch); display: flex; align-items: center; justify-content: center; transform: rotate(-10deg); flex: none; position: relative; }
.stamp::after { content: ''; position: absolute; inset: 4px; border: 1px solid currentColor; border-radius: 50%; opacity: .5; }
.stamp span { font-family: var(--display); font-size: 21px; line-height: 1; }
.stamp.great { background: var(--pitch); color: var(--pitch-ink); border-color: var(--pitch); }
.stamp.great span { font-size: 18px; }
.stamp.fail, .stamp.rest { border-color: var(--ink3); color: var(--ink3); }
@media (prefers-reduced-motion: no-preference) {
  .stamp { animation: stampin 380ms cubic-bezier(.2, .9, .3, 1.3) both; }
  @keyframes stampin { from { transform: rotate(-10deg) scale(1.7); opacity: 0; } to { transform: rotate(-10deg) scale(1); opacity: 1; } }
}
.glist { border-top: 1px solid var(--line); }
.gl { display: grid; grid-template-columns: 1.3fr 1fr .9fr; gap: 2px 10px; padding: 8px 0; border-bottom: 1px solid var(--line2); font-size: 14px; }
.gl .gc { color: var(--ink2); }
.gl .gs { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.gl .gm { grid-column: 1 / -1; }
.w, .gs.w { color: var(--win); } .l, .gs.l { color: var(--loss); }
.evs { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
.evs li { padding-left: 14px; position: relative; font-size: 14px; }
.evs li::before { content: ''; position: absolute; left: 0; top: .65em; width: 6px; height: 6px; border-radius: 50%; background: var(--ink3); }
.evs li.good::before { background: var(--win); } .evs li.bad::before { background: var(--red); } .evs li.big { font-weight: 700; }
.empty p { margin: 0; color: var(--ink2); }
.rt { display: inline-block; min-width: 34px; text-align: center; font-family: var(--num); font-weight: 700; font-size: 15px; border-radius: 3px; padding: 0 4px; color: #fff; }
.rt8 { background: #1F6FD1; } .rt7 { background: #1D8A55; } .rt6 { background: #8A8F3A; } .rt5 { background: #B5473B; }

/* ending */
.ending h1 { font-size: clamp(48px, 12vw, 92px); line-height: 1; margin: 6px 0; }
.ending .tier { font-family: var(--display); font-size: 28px; color: var(--gold); }
.ending .tier small { font-family: var(--num); font-size: 18px; color: var(--ink2); margin-left: 6px; }
.ending .lede { color: var(--ink2); font-size: 16px; max-width: 36em; }
.etot { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin: 16px 0 0; }
.etot div { border-top: 2px solid var(--ink); padding-top: 4px; }
.etot dt { font-size: 12px; color: var(--ink2); } .etot dd { margin: 0; font-family: var(--num); font-weight: 700; font-size: 32px; line-height: 1.1; }

/* player */
.prof { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; margin: 0; font-size: 14px; }
.prof dt { color: var(--ink2); } .prof dd { margin: 0; font-weight: 500; }
.ratings { display: grid; gap: 7px; }
.rt-row { display: grid; grid-template-columns: 64px 34px 22px 1fr; align-items: center; gap: 8px; font-size: 14px; }
.rt-row b { font-family: var(--num); font-weight: 700; font-size: 21px; text-align: right; }
.rt-row .bar { max-width: none; height: 8px; }
.gr { font-style: normal; font-weight: 700; text-align: center; font-size: 13px; }
.gr.gS, .gr.gA { color: var(--gold); } .gr.gB, .gr.gC { color: var(--pitch); } .gr.gD, .gr.gE { color: var(--ink2); } .gr.gF, .gr.gG { color: var(--ink3); }
.fits { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.fit { display: flex; align-items: baseline; gap: 8px; padding: 6px 8px; border: 1px solid var(--line2); border-radius: 4px; font-size: 14px; }
.fit.on { border-color: var(--pitch); background: var(--shade); }
.fit b { font-family: var(--num); font-size: 20px; margin-left: auto; }
.fit small { color: var(--ink3); font-size: 12px; }
.tiers { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 10px; }
.tiers span { border: 1px solid var(--line); border-radius: 3px; padding: 2px 8px; font-size: 13px; color: var(--ink3); }
.tiers span small { margin-left: 4px; font-size: 11px; }
.tiers span.on { border-color: var(--gold); color: var(--gold); font-weight: 700; }
.pts { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.pts li { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--line); }

.aca summary::after { content: '자세히'; font-size: 12px; color: var(--ink3); text-decoration: underline; }
.aca details[open] summary::after { content: '접기'; }
.aca-bar { display: flex; align-items: center; gap: 10px; margin: 10px 0 4px; }
.aca-bar .bar { max-width: 220px; }
.aca-l { margin: 6px 0 0; padding-left: 18px; font-size: 14px; color: var(--ink2); }
.aca-l li { margin: 2px 0; }

.stats.mini { width: 100%; table-layout: fixed; }
.stats.mini td:first-child { width: 22px; }
.stats.mini td:nth-child(3), .stats.mini td:nth-child(4) { width: 58px; }
.stats.mini td:last-child { width: 30px; }

/* site bar */
.site { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; padding: 10px 0 8px; border-bottom: 1.5px solid var(--ink); margin-bottom: 12px; }
.site .brand { background: none; border: none; padding: 0; cursor: pointer; font-size: 22px; line-height: 1.1; color: var(--pitch); }
.site-nav { display: flex; gap: 2px; flex-wrap: wrap; }
.site-nav button { background: none; border: none; cursor: pointer; padding: 6px 10px; border-radius: 4px; font-weight: 500; color: var(--ink2); min-height: 36px; }
.site-nav button:hover { background: var(--shade); color: var(--ink); }
.site-nav button.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--pitch); border-radius: 0; }
.site-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.site-cur { background: var(--shade); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-weight: 700; font-size: 13px; min-height: 32px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.site-cur small { font-weight: 400; color: var(--ink2); margin-right: 4px; }
@media (max-width: 520px) { .site .brand { font-size: 19px; } .site-nav button { padding: 6px 7px; font-size: 14px; } .site-right { margin-left: 0; } }
/* my players */
.home { padding-top: 6px; }
.home-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 10px 0 4px; }
.home-head h1 { font-size: 30px; }
.home-head h1 small { font-family: var(--body); font-size: 14px; color: var(--ink2); margin-left: 6px; }
.home-sec { font-size: 15px; margin: 22px 0 8px; color: var(--ink2); }
.home-sec small { font-family: var(--num); font-size: 15px; }
.slots { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.slot { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
.slot.ret { background: var(--paper); }
.slot-ovr { grid-row: span 2; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 58px; height: 58px; border-radius: 50%; background: var(--pitch); color: var(--pitch-ink); }
.slot.ret .slot-ovr { background: var(--ink3); }
.slot-ovr .g { font-family: var(--num); font-weight: 700; font-size: 26px; line-height: 1; }
.slot-ovr .n { font-family: var(--num); font-size: 13px; opacity: .85; }
.slot-nm { font-size: 22px; line-height: 1.2; }
.slot-nm .tag { font-family: var(--body); color: var(--ink2); border: 1px solid var(--line); font-size: 11px; }
.slot-st { font-weight: 500; font-size: 14px; }
.slot-stats { font-size: 13px; color: var(--ink2); margin-top: 2px; }
.slot-act { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.slot-more { display: flex; gap: 12px; }
.link.danger { color: var(--red); }
.file-in { position: relative; overflow: hidden; display: inline-flex; align-items: center; }
.file-in input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.ok { color: var(--win); font-weight: 500; }
.store-note { margin-top: 18px; }
.help h1 { font-size: 30px; margin: 10px 0 4px; }
.help p { margin: 0 0 8px; }
/* player and team database */
.lgsub { display: block; font-size: 11.5px; color: var(--ink3); line-height: 1.3; }
.dbt .c-club { min-width: 150px; }
.spells { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line2); }
.spells li { display: grid; grid-template-columns: 92px 1fr; gap: 0 10px; padding: 6px 0; border-bottom: 1px solid var(--line2); align-items: baseline; }
.spells .sy { font-family: var(--num); font-size: 15px; color: var(--ink2); grid-row: span 2; }
.spells .sc { font-weight: 700; }
.spells .sl { font-size: 12.5px; color: var(--ink2); grid-column: 2; }
.link.nm.sub { font-size: inherit; color: inherit; padding: 0; text-align: left; }
.rb-btns { display: inline-flex; gap: 14px; }
.tm-mv { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tm-mv h5 { margin: 0 0 4px; font-size: 13px; color: var(--ink2); }
@media (max-width: 600px) { .tm-mv { grid-template-columns: 1fr; } }
.tms td, .tmh td { white-space: nowrap; }
.tmh tr.champ td { background: color-mix(in srgb, var(--gold) 10%, transparent); }
.tag.win { color: var(--gold); border: 1px solid currentColor; }

/* my table next to the world's */
.duo-side h2 small { font-size: 12px; }
.wt-lgs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 8px; }
.wt-lgs select { font: inherit; font-size: 13px; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 4px; padding: 4px 6px; min-height: 32px; max-width: 150px; }
.wt-sub { margin-bottom: 4px; }
table.wt td, table.wt th { padding-top: 5px; padding-bottom: 5px; }
@media (min-width: 1100px) {
  .duo { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  .duo > .duo-main > .card:first-child, .duo > .duo-side { margin-top: 12px; }

}
@media (max-width: 420px) { table.wt .wdl { display: none; } }

/* accounts */
.site-acc { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.auth { display: flex; justify-content: center; padding-top: 6vh; }
.auth-card { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; }
.auth-card .seg { align-self: flex-start; }
.auth-card .field input { max-width: none; }
.auth-card .link { align-self: center; }
.acc-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.trk .tnm { font-family: var(--body); font-size: 4.2px; fill: #C9CBD2; }

.tower li .tc { width: 5px; height: 14px; border-radius: 1px; }
.tower li .n { font-weight: 700; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tower li .g { font-family: var(--num); font-size: 14px; color: #D8D9DE; text-align: right; }
.tower li .ty { font-family: var(--num); font-weight: 700; font-size: 12px; text-align: center; border-radius: 50%; width: 16px; height: 16px; line-height: 16px; border: 1.5px solid currentColor; }
.ty.S { color: #FF3B3B; } .ty.M { color: #FFD23F; } .ty.H { color: #F4F4F6; } .ty.I { color: #3DDC84; } .ty.W { color: #3D8BFF; }
.tower li .pit { font-size: 10px; color: #8E909A; text-align: center; }
.tower li.me { background: rgba(255,210,63,.16); box-shadow: inset 3px 0 0 var(--led); }
.tower li.me .n { color: var(--led); }
.tower li.out { opacity: .45; }
.tower li.fl .g { color: var(--purple); }
.tower .th { display: flex; justify-content: space-between; padding: 4px 10px 6px; font-size: 11px; color: #8E909A; letter-spacing: .06em; border-bottom: 1px solid #262830; margin-bottom: 2px; }
.qtab { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }

.qtab tr.cut td { border-top: 2px dashed var(--red); }
.lv-feed li.ov::before, .lv-feed li.pit::before { content: none; }
.lv-feed li.sc { font-weight: 700; color: var(--gold); } .lv-feed li.dnf { color: var(--red); } .lv-feed li.fin { font-weight: 700; }
.pos-big { font-family: var(--num); font-weight: 700; font-size: 34px; line-height: 1; }
.pos-big small { font-size: 16px; color: var(--ink2); margin-left: 2px; }
.pbadge { display: inline-block; min-width: 30px; text-align: center; font-family: var(--num); font-weight: 700; font-size: 15px; border-radius: 3px; padding: 0 5px; color: #fff; background: var(--ink3); }
.pbadge.p1 { background: #C9A227; } .pbadge.p2 { background: #9AA0A6; } .pbadge.p3 { background: #B0703A; } .pbadge.pts { background: var(--win); } .pbadge.dnf { background: var(--loss); }
.money { font-family: var(--num); font-size: 18px; font-weight: 700; }
.slbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tmate { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; font-size: 14px; }
.tmate b { font-family: var(--num); font-size: 22px; }
.tmate .r { text-align: right; }

.chart-wrap { max-width: 760px; }
.agechart { display: block; width: 100%; height: auto; }
.agechart .ax { font-family: var(--num); font-size: 12px; fill: var(--ink2); }
.agechart .gl { stroke: var(--line2); stroke-width: 1; }
.chart-wrap .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; margin-top: 6px; }
.chart-wrap .legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-wrap .legend i { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
.mcl li.on { background: var(--shade); }
.mcl .my { color: var(--pitch); font-weight: 700; }
.dbq { font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 4px; padding: 7px 10px; min-height: 38px; width: min(320px, 100%); }

.stats td.tl, .stats th.tl { text-align: left; }

<script>
'use strict';
/* ===================== helpers ===================== */
const R = Math.random;
const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
const pick = a => a[Math.floor(R() * a.length)];
function gauss() { let u = 0, v = 0; while (u === 0) u = R(); while (v === 0) v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const sig = x => 1 / (1 + Math.exp(-x));
const range = (a, b) => { const o = []; for (let i = a; i <= b; i++) o.push(i); return o; };
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function wchoice(pairs) { let t = 0; for (const [, w] of pairs) t += w; let r = R() * t; for (const [v, w] of pairs) { if ((r -= w) <= 0) return v; } return pairs[pairs.length - 1][0]; }
const r1 = x => Math.round(x * 10) / 10;
const S = s => s.split(',').map(x => x.trim()).filter(Boolean);
const sum = a => a.reduce((s, x) => s + x, 0);
function hash01(s) { let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 100000) / 100000; }

  if (typeof t !== 'string' || t.indexOf('(') < 0) return t;
  return t.replace(/([가-힣A-Za-z0-9]+)(이\(가\)|은\(는\)|을\(를\)|와\(과\)|\(으\)로|\(이\)라는|\(이\)다)/g, (m, w, j) => {
    const ch = w.charCodeAt(w.length - 1);
    let has, jong = 0;
    if (ch >= 0xac00 && ch <= 0xd7a3) { jong = (ch - 0xac00) % 28; has = jong !== 0; }
    else if (/[0-9]$/.test(w)) { has = '0136785'.includes(w.slice(-1)); jong = '1'.includes(w.slice(-1)) || '7'.includes(w.slice(-1)) || '8'.includes(w.slice(-1)) ? 8 : 0; }

const AW = (y, w) => y * 52 + w;

function dateOf(aw) { return new Date(Date.UTC(YR(aw), 0, 1 + WK(aw) * 7)); }

function monthOf(aw) { return dateOf(aw).getUTCMonth() + 1; }

  watch(q, opts) { return new Promise(res => { this.q = q; this.gi = 0; this.done = res; this.opts = opts || {}; document.body.classList.add('live-on'); this.load(); }); },
  load() {

    G.log.fr.forEach((f, i) => this.steps.push({ f: i }));
    this.si = 0; this.S = { G, fi: -1, feed: [], call: { t: G.q ? '예선 결과' : '곧 레이스가 시작됩니다', c: 'hd' }, fin: false, frac: 0 };

    if (main) S.call = { t: main.t, c: main.k + (main.me ? ' mine' : '') };
    else if (fr.l === 0) S.call = { t: '그리드에 차들이 섰다', c: 'hd' };
    else { const c0 = G.log.cars[fr.o[0]], g2 = fr.g[1] >= 0 ? fr.g[1] / 10 : null; S.call = { t: `${fr.l}랩 · 선두 ${c0.nm}${g2 != null ? ` (2위와 ${g2.toFixed(1)}초)` : ''}`, c: 'hd' }; }

}
